<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10253e"><title>J Seguridad PRO</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#16263a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#10253e;color:white;padding:20px 18px 16px}header h1{font-size:22px;margin:0}header small{opacity:.8}.wrap{max-width:780px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 18px #142b4410}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:16px 0 8px}p{line-height:1.5}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cdd6e2;border-radius:10px;background:white}textarea{min-height:80px}button{font:inherit;border:0;border-radius:11px;padding:12px 14px;background:#1769ba;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e9eff6;color:#18344f}button.warn{background:#b43f38}button.green{background:#16845c}button:disabled{opacity:.45}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1 1 145px}.muted{color:#64748b;font-size:13px}.hidden{display:none!important}.pill{display:inline-block;background:#eaf3ff;color:#17599d;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.item{border-top:1px solid #e8edf3;padding:12px 0}.item:first-child{border-top:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.tabs button{white-space:nowrap;background:#e4ebf3;color:#173a5c}.tabs button.active{background:#1769ba;color:white}.notice{padding:10px 12px;border-radius:10px;background:#fff4db;color:#78530d;font-size:13px}.ok{background:#e4f6ed;color:#146543}.metric{font-size:28px;font-weight:800;margin:4px 0}.clock{font-variant-numeric:tabular-nums;font-size:30px;font-weight:750}footer{text-align:center;color:#64748b;padding:16px;font-size:12px}
</style></head><body><header><div class="top"><div><h1>🛡️ J Seguridad PRO</h1><small>Control de jornada y trabajos</small></div><button id="logout" class="secondary hidden" onclick="logout()">Salir</button></div></header><main class="wrap"><section id="login" class="card"><h2>Acceso</h2><p class="muted">Introduce tu usuario y PIN.</p><label>Usuario</label><input id="loginName" autocomplete="username" placeholder="Ej.: coordinador"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><div style="margin-top:14px"><button onclick="login()" style="width:100%">Entrar</button></div><p id="loginError" class="muted"></p><div class="notice">Primera instalación: usuario <b>coordinador</b> y PIN <b>1234</b>. Cambia el PIN al entrar. Este modo de prueba guarda los datos solo en este navegador.</div></section><section id="app" class="hidden"><div class="card top"><div><b id="hello"></b><div id="role" class="muted"></div></div><span class="pill" id="today"></span></div><div id="tabs" class="tabs"></div><div id="content"></div></section></main><footer>J Seguridad PRO · Versión local de prueba</footer><script>
'use strict';const KEY='jseguridadpro_v1';let db,me,tab='fichaje';const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>new Date().toISOString();const dateKey=t=>new Date(t).toLocaleDateString('sv-SE');const fmt=t=>new Date(t).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'});const mins=n=>`${Math.floor(n/60)} h ${String(n%60).padStart(2,'0')} min`;const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.users)){db={users:[{id:'admin',name:'coordinador',pin:'1234',role:'admin',display:'Coordinador'}],events:[],jobs:[],comments:[]};save()}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function current(){return db.users.find(u=>u.id===me)}function login(){const name=el('loginName').value.trim().toLowerCase(),pin=el('loginPin').value;const u=db.users.find(u=>u.name.toLowerCase()===name&&u.pin===pin);if(!u){el('loginError').textContent='Usuario o PIN incorrecto';return}me=u.id;sessionStorage.setItem('jseg_session',me);tab='fichaje';render()}function logout(){me=null;sessionStorage.removeItem('jseg_session');render()}
function eventState(id){const ev=db.events.filter(e=>e.userId===id).sort((a,b)=>a.at.localeCompare(b.at));let state='fuera';for(const e of ev){if(e.type==='entrada')state='trabajando';if(e.type==='desayuno'||e.type==='comida')state=e.type;if(e.type==='reanudar')state='trabajando';if(e.type==='salida')state='fuera'}return state}function totals(id,day){const ev=db.events.filter(e=>e.userId===id&&dateKey(e.at)===day).sort((a,b)=>a.at.localeCompare(b.at));let active=null,work=0,breakStart=null,rest=0;for(const e of ev){const t=new Date(e.at).getTime();if(e.type==='entrada'||e.type==='reanudar'){if(breakStart!==null){rest+=Math.max(0,Math.floor((t-breakStart)/60000));breakStart=null}active=t}if(e.type==='desayuno'||e.type==='comida'){if(active!==null){work+=Math.max(0,Math.floor((t-active)/60000));active=null}breakStart=t}if(e.type==='salida'){if(active!==null){work+=Math.max(0,Math.floor((t-active)/60000));active=null}if(breakStart!==null){rest+=Math.max(0,Math.floor((t-breakStart)/60000));breakStart=null}}}const t=Date.now();if(day===dateKey(now())){if(active!==null)work+=Math.max(0,Math.floor((t-active)/60000));if(breakStart!==null)rest+=Math.max(0,Math.floor((t-breakStart)/60000))}return {work,rest}}
function clock(type){const st=eventState(me),allowed={fuera:['entrada'],trabajando:['desayuno','comida','salida'],desayuno:['reanudar','salida'],comida:['reanudar','salida']};if(!allowed[st].includes(type))return;const btns=document.querySelectorAll('[data-clock]');btns.forEach(b=>b.disabled=true);const last=db.events.filter(e=>e.userId===me).at(-1);if(last&&Date.now()-new Date(last.at).getTime()<1500){render();return}db.events.push({id:uid(),userId:me,type,at:now()});save();render()}
function render(){const u=current();el('login').classList.toggle('hidden',!!u);el('app').classList.toggle('hidden',!u);el('logout').classList.toggle('hidden',!u);if(!u)return;el('hello').textContent=u.display;el('role').textContent=u.role==='admin'?'Coordinador · vista general':'Trabajador · acceso privado';el('today').textContent=new Date().toLocaleDateString('es-ES');const tabs=u.role==='admin'?[['fichaje','Mi fichaje'],['equipo','Equipo'],['faenas','Faenas'],['registros','Registros'],['ajustes','Ajustes']]:[['fichaje','Fichaje'],['faenas','Mis faenas'],['registros','Mi registro'],['ajustes','Mi PIN']];if(!tabs.some(t=>t[0]===tab))tab='fichaje';el('tabs').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');el('content').innerHTML=({fichaje:viewClock,equipo:viewTeam,faenas:viewJobs,registros:viewRecords,ajustes:viewSettings}[tab])()}
function go(t){tab=t;render()}function viewClock(){const st=eventState(me),t=totals(me,dateKey(now())),labels={fuera:'Fuera de jornada',trabajando:'Trabajando',desayuno:'Descanso: desayuno',comida:'Descanso: comida'};const buttons={fuera:[['entrada','▶ Entrada','green']],trabajando:[['desayuno','☕ Desayuno','secondary'],['comida','🍽 Comida','secondary'],['salida','■ Salida','warn']],desayuno:[['reanudar','▶ Volver al trabajo','green'],['salida','■ Salida','warn']],comida:[['reanudar','▶ Volver al trabajo','green'],['salida','■ Salida','warn']]}[st];return `<div class="card"><h2>Fichaje de un toque</h2><p class="pill">${labels[st]}</p><div class="clock" id="clockTime">${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div><div class="actions">${buttons.map(([k,l,c])=>`<button data-clock class="${c}" onclick="clock('${k}')">${l}</button>`).join('')}</div><p class="muted">Se registra automáticamente al pulsar. Sin WhatsApp ni formularios.</p></div><div class="card"><h2>Resumen de hoy</h2><div class="metric">${mins(t.work)}</div><div class="muted">Tiempo efectivo trabajado</div><p>Descansos no computables: <b>${mins(t.rest)}</b></p></div>${myJobsPreview()}`}
function myJobsPreview(){const jobs=db.jobs.filter(j=>j.userId===me&&j.status!=='hecho');return `<div class="card"><h2>Mis faenas pendientes (${jobs.length})</h2>${jobs.length?jobs.slice(0,4).map(j=>`<div class="item"><b>${esc(j.title)}</b><div class="muted">${esc(j.place||'Sin ubicación')} · ${esc(j.date||'Sin fecha')}</div></div>`).join(''):'<p class="muted">No hay faenas pendientes.</p>'}</div>`}
function viewTeam(){if(current().role!=='admin')return '';return `<div class="card"><h2>Dar de alta trabajador</h2><label>Nombre visible</label><input id="newDisplay" placeholder="Nombre y apellidos"><label>Usuario (sin espacios)</label><input id="newName" placeholder="ej. david"><label>PIN inicial (mínimo 4 números)</label><input id="newPin" inputmode="numeric" placeholder="PIN"><p><button onclick="addUser()">Añadir trabajador</button></p><p id="userMsg" class="muted"></p></div><div class="card"><h2>Trabajadores</h2>${db.users.filter(u=>u.role!=='admin').map(u=>`<div class="item"><b>${esc(u.display)}</b><div class="muted">Usuario: ${esc(u.name)} · ${esc(eventState(u.id))}</div><button class="secondary" onclick="resetPin('${u.id}')">Cambiar PIN</button></div>`).join('')||'<p class="muted">Todavía no hay trabajadores.</p>'}</div>`}
function addUser(){const display=el('newDisplay').value.trim(),name=el('newName').value.trim().toLowerCase(),pin=el('newPin').value;if(!display||!/^[a-z0-9._-]{2,30}$/.test(name)||!/^[0-9]{4,12}$/.test(pin)){el('userMsg').textContent='Rellena los campos. Usuario sin espacios y PIN de 4 a 12 números.';return}if(db.users.some(u=>u.name===name)){el('userMsg').textContent='Ese usuario ya existe.';return}db.users.push({id:uid(),display,name,pin,role:'worker'});save();render()}
function resetPin(id){if(current().role!=='admin')return;const p=prompt('Nuevo PIN (4 a 12 números):');if(p===null)return;if(!/^[0-9]{4,12}$/.test(p)){alert('PIN no válido');return}db.users.find(u=>u.id===id).pin=p;save();alert('PIN actualizado')}
function viewJobs(){const admin=current().role==='admin',jobs=db.jobs.filter(j=>admin||j.userId===me).sort((a,b)=>(a.status==='hecho')-(b.status==='hecho'));return `${admin?`<div class="card"><h2>Asignar faena privada</h2><label>Trabajador</label><select id="jobUser">${db.users.filter(u=>u.role==='worker').map(u=>`<option value="${u.id}">${esc(u.display)}</option>`).join('')}</select><label>Trabajo</label><input id="jobTitle" placeholder="Instalar cámaras, revisión alarma..."><label>Dirección / ubicación</label><input id="jobPlace" placeholder="Dirección del servicio"><label>Fecha</label><input id="jobDate" type="date" value="${dateKey(now())}"><label>Instrucciones</label><textarea id="jobNotes" placeholder="Detalles de la faena"></textarea><p><button onclick="addJob()">Asignar faena</button></p><p id="jobMsg" class="muted"></p></div>`:''}<div class="card"><h2>${admin?'Todas las faenas':'Mis faenas'}</h2>${jobs.map(j=>{const worker=db.users.find(u=>u.id===j.userId);const comments=db.comments.filter(c=>c.jobId===j.id);return `<div class="item"><div class="top"><b>${esc(j.title)}</b><span class="pill">${j.status==='hecho'?'Finalizada':j.status==='leida'?'Leída':'Pendiente'}</span></div><div class="muted">${admin?esc(worker?.display||'Trabajador eliminado')+' · ':''}${esc(j.date||'Sin fecha')} · ${esc(j.place||'Sin dirección')}</div><p>${esc(j.notes||'Sin instrucciones')}</p>${!admin&&j.status==='pendiente'?`<button class="secondary" onclick="readJob('${j.id}')">Marcar como leída</button>`:''}${!admin&&j.status!=='hecho'?`<button class="green" onclick="doneJob('${j.id}')">Finalizar faena</button>`:''}<h3>Parte diario / comentarios</h3>${comments.map(c=>`<p class="muted"><b>${esc(db.users.find(u=>u.id===c.userId)?.display||'Usuario')}:</b> ${esc(c.text)} <small>(${fmt(c.at)})</small></p>`).join('')}<textarea id="comment_${j.id}" placeholder="Trabajo realizado, incidencias, materiales..."></textarea><p><button class="secondary" onclick="addComment('${j.id}')">Guardar comentario</button></p></div>`}).join('')||'<p class="muted">No hay faenas asignadas.</p>'}</div>`}
function addJob(){const userId=el('jobUser').value,title=el('jobTitle').value.trim();if(!userId||!title){el('jobMsg').textContent='Selecciona un trabajador e indica el trabajo.';return}db.jobs.push({id:uid(),userId,title,place:el('jobPlace').value.trim(),date:el('jobDate').value,notes:el('jobNotes').value.trim(),status:'pendiente',createdAt:now()});save();render()}
function readJob(id){const j=db.jobs.find(j=>j.id===id&&j.userId===me);if(j&&j.status==='pendiente'){j.status='leida';j.readAt=now();save();render()}}function doneJob(id){const j=db.jobs.find(j=>j.id===id&&j.userId===me);if(j){j.status='hecho';j.doneAt=now();save();render()}}function addComment(id){const j=db.jobs.find(j=>j.id===id);if(!j||(current().role!=='admin'&&j.userId!==me))return;const text=el('comment_'+id).value.trim();if(!text)return;db.comments.push({id:uid(),jobId:id,userId:me,text,at:now()});save();render()}
function viewRecords(){const admin=current().role==='admin',events=db.events.filter(e=>admin||e.userId===me).sort((a,b)=>b.at.localeCompare(a.at));const labels={entrada:'Entrada',salida:'Salida',desayuno:'Inicio desayuno',comida:'Inicio comida',reanudar:'Fin descanso / reanudación'};return `<div class="card"><div class="top"><h2>Registro de fichajes</h2>${admin?'<button class="secondary" onclick="exportCSV()">Exportar CSV</button>':''}</div>${events.slice(0,200).map(e=>`<div class="item"><b>${esc(labels[e.type])}</b><div class="muted">${esc(db.users.find(u=>u.id===e.userId)?.display||'Usuario')} · ${fmt(e.at)}</div></div>`).join('')||'<p class="muted">Todavía no hay fichajes.</p>'}</div>`}
function exportCSV(){if(current().role!=='admin')return;const lines=[['Trabajador','Tipo','Fecha y hora'],...db.events.map(e=>[db.users.find(u=>u.id===e.userId)?.display||'',e.type,fmt(e.at)])];const csv='\ufeff'+lines.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');download('fichajes.csv',csv,'text/csv;charset=utf-8')}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function viewSettings(){return `<div class="card"><h2>Cambiar mi PIN</h2><label>Nuevo PIN (4 a 12 números)</label><input id="pinNew" inputmode="numeric" type="password"><p><button onclick="changePin()">Guardar PIN</button></p></div><div class="card"><h2>Información importante</h2><div class="notice">Esta versión funciona en un solo navegador/dispositivo. GitHub Pages no incluye base de datos ni acceso seguro compartido. Los trabajadores no podrán sincronizar fichajes ni faenas entre móviles hasta conectar un servicio de autenticación y base de datos (por ejemplo, Supabase). Los PIN de esta demo no son seguros para uso real.</div>${current().role==='admin'?'<p><button class="secondary" onclick="backup()">Descargar copia de datos (JSON)</button></p>':''}</div>`}function changePin(){const p=el('pinNew').value;if(!/^[0-9]{4,12}$/.test(p)){alert('PIN no válido');return}current().pin=p;save();alert('PIN cambiado correctamente');render()}function backup(){download('jseguridadpro-copia.json',JSON.stringify(db,null,2),'application/json')}
load();me=sessionStorage.getItem('jseg_session');if(!current())me=null;render();setInterval(()=>{const c=el('clockTime');if(c)c.textContent=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})},15000);
</script></body></html>
